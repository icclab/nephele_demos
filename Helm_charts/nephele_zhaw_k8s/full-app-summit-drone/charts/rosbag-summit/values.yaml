fullnameOverride: rosbag-summit
replicaCount: 1

image:
  corsNginx:
    repository: robopaas/cors-summit
  rosbagSaver:
    repository: robopaas/rosbagsaver:demo
    pullPolicy: Always

service:
  nginx:
    nodePort: 30827
    name: ngnix-service-summit
    port: 80

traefik:
  ingressName: nginx-ingress-vo2
  enabled: true
  host: nginx-vo2.nephele-project.ch
  entrypoints: websecure
  tls: true
  tlsSecret: letsencrypt-cert-production


env:
  ROS_DOMAIN_ID: "0"
  
  
resources:
  requests:
    memory: "256Mi"
    cpu: "1"
  limits:
    memory: "512Mi"
    cpu: "1"   



