fullnameOverride: vo1
replicaCount: 1

image:
  wotpy: 
    repository: nepheleproject/vo-wot
    pullPolicy: Always

service:
  vo1:
    nodePort: 
      http: 30875
      cataloguePort: 30876

env:
  HOSTNAME: vo1
  ROS_DOMAIN_ID: "0"

resources:
  requests:
    memory: "256Mi"
    cpu: "1"
  limits:
    memory: "512Mi"
    cpu: "1"   



