fullnameOverride: fxg-zenoh-bridges-vo1
replicaCount: 1

image:
  foxgloveZenohBridge:
    repository: robopaas/foxglove-zenoh-bridges
    tag: latest
    pullPolicy: Always
  foxgloveStudio:
    repository: robopaas/foxglove-studio
    tag: latest
    pullPolicy: Always

resources:
  foxgloveZenohBridge:
    requests:
      memory: "256Mi"
      cpu: "1"
    limits:
      memory: "512Mi"
      cpu: "1"
  foxgloveStudio:
    requests:
      memory: "256Mi"
      cpu: "1"
    limits:
      memory: "512Mi"
      cpu: "1"

env:
  ROS_HOSTNAME: foxglove-zenoh-bridges

service:
  ports:
    fxgWsPort: 8765
    webguiPort: 8080


ingress:
  enabled: true
  configurations:
    - name: foxglove-zenoh-bridges-vo-ingress
      host: bridges-vo.robopaas.dev
      path: /
      port: 8765
      labels: foxglove-zenoh-bridges-vo
    - name: foxglove-ingress-vo
      host: foxglove-demo-vo.robopaas.dev
      labels: foxglove-zenoh-bridges-vo
      path: /
      port: 8080
      
      
volumes:
  foxgloveConfig:
    name: foxglove-config-vo
    configMap:
      name: foxglove-demo-vo

