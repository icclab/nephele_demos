apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride | default .Chart.Name }}-deployment
  labels:
    app: vo1
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vo1
  template:
    metadata:
      labels:
        app: vo1
    spec:
      volumes:
        - name: scripts
          configMap:
            name: vo1-scripts
            items:
              - key: app.py
                path: app.py
              - key: config.yaml
                path: config.yaml
              - key: td.json
                path: td.json        
      containers:
        - name: wotpy
          image: {{ .Values.image.wotpy.repository }}
          imagePullPolicy: {{ .Values.image.wotpy.pullPolicy }}
          volumeMounts:
            - name: scripts
              mountPath: /app.py
              subPath: app.py
            - name: scripts
              mountPath: /config.yaml
              subPath: config.yaml
            - name: scripts
              mountPath: /td.json
              subPath: td.json
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: HOSTNAME
              value: "{{ .Values.env.HOSTNAME }}"

