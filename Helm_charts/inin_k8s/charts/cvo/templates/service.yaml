apiVersion: v1
kind: Service
metadata:
  name: cvo
  labels:
    app: cvo
spec:
  type: NodePort
  selector:
    app: cvo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.service.cvo.nodePort.http }}
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      nodePort: {{ .Values.service.cvo.nodePort.cataloguePort }}
      protocol: TCP
      name: catalogue-port
