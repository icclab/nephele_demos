apiVersion: v1
kind: Service
metadata:
  name: vo2
  labels:
    app: vo2
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.service.vo2.nodePort.http }}
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      nodePort: {{ .Values.service.vo2.nodePort.cataloguePort }}
      protocol: TCP
      name: catalogue-port
  selector:
    app: vo2

